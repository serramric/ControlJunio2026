name: Verificar publicar y anunciar

on:
  workflow_dispatch:

  push:
    branches:
      - desarrollo

permissions:
  contents: read
  packages: write

jobs:
  verificar:
    name: Verificar código
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dar permisos al wrapper
        run: chmod +x gradlew

      - name: Ejecutar tests
        run: ./gradlew clean test

  publicar:
    name: Publicar artefacto y anunciar
    runs-on: ubuntu-latest
    needs: verificar

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dar permisos al wrapper
        run: chmod +x gradlew

      - name: Publicar artefacto en GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Anunciar publicación en Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          GAV: us.dit.muit.fs.serramric:gestor-dispositivos:1.0.${{ github.run_number }}
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo "No se ha configurado el secret TEAMS_WEBHOOK_URL"
            exit 1
          fi

          PAYLOAD=$(jq -n \
            --arg actor "${{ github.actor }}" \
            --arg repo "${{ github.repository }}" \
            --arg gav "$GAV" \
            '{text: ("Nueva publicación de artefacto\n\nUsuario que realizó el merge: " + $actor + "\nRepositorio: " + $repo + "\nGAV: " + $gav)}')

          curl -sS -H "Content-Type: application/json" -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL"

name: Generar Javadoc

on:
  push:
    branches:
      - requisito-alta-dispositivo
    paths-ignore:
      - 'recursos/**'

permissions:
  contents: write

jobs:
  generar-javadoc:
    name: Crear documentación Javadoc
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dar permisos al wrapper
        run: chmod +x gradlew

      - name: Generar Javadoc
        run: ./gradlew javadoc

      - name: Copiar Javadoc a carpeta recursos
        run: |
          rm -rf recursos
          mkdir -p recursos
          cp -R build/docs/javadoc/* recursos/

      - name: Crear commit con documentación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain recursos)" ]; then
            git add recursos
            git commit -m "Generar documentación Javadoc"
            git push
          else
            echo "No hay cambios en la documentación Javadoc"
          fi
